name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Debug - List all files
        run: |
          echo "=== Contenu de dist/ ==="
          ls -la dist/
          echo "=== Contenu de dist/client/ (si existe) ==="
          if [ -d "dist/client" ]; then ls -la dist/client/; fi
      
      - name: Move files from client to root
        run: |
          if [ -d "dist/client" ]; then
            echo "Déplacement des fichiers de dist/client vers dist/"
            mv dist/client/* dist/
            rm -rf dist/client
          fi
          echo "=== Contenu final de dist/ ==="
          ls -la dist/
      
      - name: Create .nojekyll
        run: touch dist/.nojekyll
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
